document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(0); } }\n  @keyframes tmSweep { from { width: 0; opacity: 0.2; } to { width: 300px; opacity: 1; } }\n  @keyframes tmOut { from { opacity: 1; } to { opacity: 0; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#0b0c0d;color:#f2f3f4;min-height:100vh\">\n\n  <sc-if value=\"{{ intro }}\">\n    <div sc-camel-on-click=\"{{ skipIntro }}\" style=\"position:fixed;inset:0;z-index:90;background:#07080a;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:tmOut 0.55s ease 2.55s forwards\">\n      <div style=\"position:relative;width:100%;height:340px;overflow:hidden\">\n        <div style=\"position:absolute;left:0;right:0;bottom:118px;height:1px;background:rgba(255,255,255,0.13)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:-160px;right:-160px;bottom:104px;height:3px;background:repeating-linear-gradient(90deg, rgba(255,255,255,0.34) 0 46px, rgba(255,255,255,0) 46px 160px);animation:tmRoad 0.42s linear infinite\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:104px;background:linear-gradient(rgba(255,255,255,0.05), rgba(255,255,255,0))\"><\u002Fdiv>\n        <sc-if value=\"{{ hayLogo }}\">\n          <img src=\"{{ logo }}\" alt=\"TM Motors\" style=\"position:absolute;left:50%;bottom:130px;width:210px;height:210px;border-radius:50%;object-fit:cover;transform:translateX(-50%);animation:tmDrive 1.75s cubic-bezier(0.18,0.75,0.2,1) both\">\n        <\u002Fsc-if>\n        <div style=\"position:absolute;left:50%;bottom:104px;transform:translateX(-50%);height:2px;background:linear-gradient(90deg, rgba(196,30,30,0), #c41e1e, rgba(196,30,30,0));animation:tmSweep 0.7s ease 1.55s both\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:12px;letter-spacing:0.34em;text-transform:uppercase;color:#8b9198;animation:tmFadeUp 0.7s ease 1.8s both\">Compra &amp; venta de vehículos seleccionados<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <header style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 40px;background:rgba(11,12,13,0.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.08)\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:12px\">\n      <sc-if value=\"{{ hayLogo }}\">\n        <img src=\"{{ logo }}\" alt=\"TM Motors\" style=\"width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,0.18);display:block\">\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;line-height:1.05\">\n        <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:17px;letter-spacing:0.14em\">TM MOTORS<\u002Fspan>\n        <span style=\"font-size:11px;letter-spacing:0.26em;color:#8b9198;text-transform:uppercase\">Automotores<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:32px;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#9aa0a6\">\n      <a href=\"#stock\" style=\"color:#9aa0a6\" style-hover=\"color:#ffffff\">Stock<\u002Fa>\n      <a href=\"#servicios\" style=\"color:#9aa0a6\" style-hover=\"color:#ffffff\">Servicios<\u002Fa>\n      <a href=\"#contacto\" style=\"color:#9aa0a6\" style-hover=\"color:#ffffff\">Contacto<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <a href=\"{{ waGeneral }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:9px;background:#1f8f5f;color:#ffffff;padding:11px 18px;font-family:Archivo,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid #24a56d\" style-hover=\"background:#24a56d;color:#ffffff\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#bff0d6;display:inline-block\"><\u002Fspan>\n        WhatsApp\n      <\u002Fa>\n      <button sc-camel-on-click=\"{{ openAdmin }}\" style=\"background:transparent;color:#9aa0a6;border:1px solid rgba(255,255,255,0.14);padding:11px 16px;font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"color:#ffffff;border-color:rgba(255,255,255,0.4)\">Panel<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"position:relative;padding:96px 40px 72px;border-bottom:1px solid rgba(255,255,255,0.08);overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);background-size:68px 68px;mask-image:radial-gradient(85% 75% at 50% 42%, #000 15%, transparent 78%);-webkit-mask-image:radial-gradient(85% 75% at 50% 42%, #000 15%, transparent 78%);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg, #24a56d, rgba(36,165,109,0) 58%);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:26px\">\n        <span style=\"font-size:11.5px;letter-spacing:0.34em;text-transform:uppercase;color:#8b9198\">Zona Norte · Buenos Aires<\u002Fspan>\n        <h1 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:800;font-size:62px;line-height:1.02;letter-spacing:-0.02em;text-wrap:balance\">Compra &amp; venta de<br>vehículos seleccionados.<\u002Fh1>\n        <p style=\"margin:0;max-width:520px;font-size:17.5px;line-height:1.62;color:#a8aeb4;text-wrap:pretty\">Compra, venta y consignación de vehículos con historial verificado. Cada unidad de nuestro stock es revisada antes de publicarse y la operación se cierra con documentación al día.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <a href=\"#stock\" style=\"background:#f2f3f4;color:#0b0c0d;padding:15px 26px;font-family:Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase\" style-hover=\"background:#ffffff;color:#0b0c0d\">Ver stock disponible<\u002Fa>\n          <a href=\"{{ waGeneral }}\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid rgba(255,255,255,0.2);color:#f2f3f4;padding:15px 26px;font-family:Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase\" style-hover=\"border-color:rgba(255,255,255,0.5);color:#ffffff\">Consultar por WhatsApp<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:44px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:26px\">{{ stats.total }}<\u002Fspan>\n            <span style=\"font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:#8b9198\">Unidades en stock<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:26px\">100%<\u002Fspan>\n            <span style=\"font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:#8b9198\">Verificación técnica<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:26px\">@tmmotorsok<\u002Fspan>\n            <span style=\"font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:#8b9198\">Instagram<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;aspect-ratio:4/3;border:1px solid rgba(255,255,255,0.1);overflow:hidden;background:#101215\">\n        <sc-if value=\"{{ hayHero }}\">\n          <a href=\"#stock\" style=\"display:block;position:absolute;inset:0\">\n            <img src=\"{{ heroImg }}\" alt=\"{{ heroTitulo }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n            <span style=\"position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(rgba(11,12,13,0) 0%, rgba(11,12,13,0.86) 70%);pointer-events:none\"><\u002Fspan>\n            <span style=\"position:absolute;left:22px;bottom:20px;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:10.5px;letter-spacing:0.22em;text-transform:uppercase;color:#8fd8b4\">En stock<\u002Fspan>\n              <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:26px;color:#ffffff;line-height:1.1\">{{ heroTitulo }}<\u002Fspan>\n              <span style=\"font-size:14px;color:#c9ced3\">{{ heroDetalle }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"stock\" style=\"padding:72px 40px 40px\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,0.08)\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-size:11.5px;letter-spacing:0.34em;text-transform:uppercase;color:#8b9198\">Stock actual<\u002Fspan>\n          <h2 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:700;font-size:36px;letter-spacing:-0.01em\">Unidades disponibles<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Buscar marca o modelo\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:12px 14px;font-size:14px;min-width:230px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n          <sc-raw-select value=\"{{ estado }}\" sc-camel-on-change=\"{{ onEstado }}\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:12px 14px;font-size:14px;outline:none;cursor:pointer\">\n            <option value=\"todos\">Todos los estados<\u002Foption>\n            <option value=\"Disponible\">Disponible<\u002Foption>\n            <option value=\"Reservado\">Reservado<\u002Foption>\n            <option value=\"Vendido\">Vendido<\u002Foption>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ sort }}\" sc-camel-on-change=\"{{ onSort }}\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:12px 14px;font-size:14px;outline:none;cursor:pointer\">\n            <option value=\"recientes\">Más recientes<\u002Foption>\n            <option value=\"precio-asc\">Precio: menor a mayor<\u002Foption>\n            <option value=\"precio-desc\">Precio: mayor a menor<\u002Foption>\n            <option value=\"km-asc\">Menos kilómetros<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px;padding:34px 0 0\">\n        <sc-for list=\"{{ visibles }}\" as=\"car\" hint-placeholder-count=\"4\">\n          <article style=\"display:flex;flex-direction:column;background:#101215;border:1px solid rgba(255,255,255,0.09)\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-bottom:1px solid rgba(255,255,255,0.09)\">\n              <image-slot id=\"{{ car.slotId }}\" src=\"{{ car.img }}\" shape=\"rect\" placeholder=\"{{ car.slotHint }}\"><\u002Fimage-slot>\n              <div style=\"position:absolute;top:12px;left:12px;display:flex;gap:8px;pointer-events:none\">\n                <sc-if value=\"{{ car.isDisponible }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"background:rgba(31,143,95,0.92);color:#ffffff;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;padding:6px 10px;font-weight:600\">Disponible<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ car.isReservado }}\">\n                  <span style=\"background:rgba(196,148,44,0.92);color:#14100a;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;padding:6px 10px;font-weight:600\">Reservado<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ car.isVendido }}\">\n                  <span style=\"background:rgba(11,12,13,0.86);color:#c9ced3;border:1px solid rgba(255,255,255,0.2);font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;padding:6px 10px;font-weight:600\">Vendido<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px;padding:20px 22px 22px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <h3 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:700;font-size:19.5px;line-height:1.25\">{{ car.titulo }}<\u002Fh3>\n                <span style=\"font-size:13.5px;color:#8b9198\">{{ car.version }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0;border-top:1px solid rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.08)\">\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <span style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#7d8389\">Año<\u002Fspan>\n                  <span style=\"font-size:14.5px;font-weight:500\">{{ car.anio }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <span style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#7d8389\">Km<\u002Fspan>\n                  <span style=\"font-size:14.5px;font-weight:500\">{{ car.kmFmt }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <span style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#7d8389\">Caja<\u002Fspan>\n                  <span style=\"font-size:14.5px;font-weight:500\">{{ car.transmision }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:2px\">\n                  <span style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#7d8389\">Precio<\u002Fspan>\n                  <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:25px;letter-spacing:-0.01em\">{{ car.precioFmt }}<\u002Fspan>\n                <\u002Fdiv>\n                <a href=\"{{ car.wa }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:8px;background:#1f8f5f;border:1px solid #24a56d;color:#ffffff;padding:12px 16px;font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.1em;text-transform:uppercase\" style-hover=\"background:#24a56d;color:#ffffff\">Consultar<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ vacio }}\">\n        <div style=\"padding:64px 0;text-align:center;color:#8b9198;font-size:15px\">No hay unidades que coincidan con la búsqueda.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"servicios\" style=\"padding:64px 40px 80px\">\n    <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.09)\">\n      <div style=\"backgroun ction:column;gap:20px\">\n        <span style=\"font-size:11.5px;letter-spacing:0.34em;text-transform:uppercase;color:#8b9198\">Contacto<\u002Fspan>\n        <h2 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:800;font-size:42px;line-height:1.08;letter-spacing:-0.02em\">Escribinos y coordinamos<br>una visita.<\u002Fh2>\n        <p style=\"margin:0;max-width:480px;font-size:16.5px;line-height:1.6;color:#a8aeb4\">Atención por WhatsApp de lunes a sábados, de 9 a 19 h. Si buscás una unidad puntual que no está publicada, la conseguimos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;background:#101215;border:1px solid rgba(255,255,255,0.09);padding:28px\">\n        <a href=\"{{ waGeneral }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;background:#1f8f5f;border:1px solid #24a56d;color:#ffffff;padding:18px 22px\" style-hover=\"background:#24a56d;color:#ffffff\">\n          <span style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.82\">WhatsApp directo<\u002Fspan>\n            <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:19px\">+54 9 11 6448 9906<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:20px\">→<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://instagram.com/tmmotorsok\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid rgba(255,255,255,0.14);color:#f2f3f4;padding:18px 22px\" style-hover=\"border-color:rgba(255,255,255,0.45);color:#ffffff\">\n          <span style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:#8b9198\">Instagram<\u002Fspan>\n            <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:19px\">@tmmotorsok<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:20px\">→<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:28px 40px;border-top:1px solid rgba(255,255,255,0.08);font-size:13px;color:#7d8389\">\n    <span style=\"letter-spacing:0.14em;text-transform:uppercase\">TM Motors · Automotores<\u002Fspan>\n    <span>Precios expresados en dólares estadounidenses. Sujetos a modificación sin previo aviso.<\u002Fspan>\n  <\u002Ffooter>\n\n  <a href=\"{{ waGeneral }}\" target=\"_blank\" rel=\"noopener\" style=\"position:fixed;right:26px;bottom:26px;z-index:45;display:flex;align-items:center;gap:10px;background:#1f8f5f;border:1px solid #2cba7c;color:#ffffff;padding:15px 20px;font-family:Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;box-shadow:0 18px 40px rgba(0,0,0,0.5)\" style-hover=\"background:#24a56d;color:#ffffff\">\n    <span style=\"width:8px;height:8px;border-radius:50%;background:#c9f5df;display:inline-block\"><\u002Fspan>\n    Escribinos\n  <\u002Fa>\n\n  <sc-if value=\"{{ adminOpen }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:rgba(6,7,8,0.72);backdrop-filter:blur(4px);display:flex;justify-content:flex-end\">\n      <div style=\"width:min(560px,100%);height:100%;background:#0e0f11;border-left:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;border-bottom:1px solid rgba(255,255,255,0.1)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:18px;letter-spacing:0.02em\">Panel de stock<\u002Fspan>\n            <span style=\"font-size:12px;color:#8b9198\">Alta, edición y baja de unidades<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeAdmin }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,0.14);color:#c9ced3;width:36px;height:36px;font-size:16px;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,0.45);color:#ffffff\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ needsPin }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;padding:34px 26px\">\n            <span style=\"font-size:14.5px;color:#a8aeb4\">Ingresá el código de acceso para administrar el stock.<\u002Fspan>\n            <input value=\"{{ pin }}\" sc-camel-on-change=\"{{ onPin }}\" type=\"password\" placeholder=\"Código\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.14);color:#f2f3f4;padding:14px;font-size:15px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n            <button sc-camel-on-click=\"{{ tryPin }}\" style=\"background:#f2f3f4;color:#0b0c0d;border:none;padding:14px;font-family:Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#ffffff\">Entrar<\u002Fbutton>\n            <sc-if value=\"{{ pinError }}\">\n              <span style=\"font-size:13px;color:#e0705f\">Código incorrecto.<\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"font-size:12.5px;color:#6b7076\">Código inicial: 2468 — se puede cambiar en el código de la página.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ authed }}\">\n          <div style=\"flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:22px\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;border:1px solid rgba(255,255,255,0.1);padding:20px\">\n              <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:#a8aeb4\">{{ formTitle }}<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n                <input value=\"{{ form.marca }}\" sc-camel-on-change=\"{{ onField.marca }}\" placeholder=\"Marca\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n                <input value=\"{{ form.modelo }}\" sc-camel-on-change=\"{{ onField.modelo }}\" placeholder=\"Modelo\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n              <\u002Fdiv>\n              <input value=\"{{ form.version }}\" sc-camel-on-change=\"{{ onField.version }}\" placeholder=\"Versión (ej. 3.0 V6 TFSI Quattro)\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n                <input value=\"{{ form.anio }}\" sc-camel-on-change=\"{{ onField.anio }}\" placeholder=\"Año\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n                <input value=\"{{ form.km }}\" sc-camel-on-change=\"{{ onField.km }}\" placeholder=\"Km\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n                <input value=\"{{ form.precio }}\" sc-camel-on-change=\"{{ onField.precio }}\" placeholder=\"Precio U$S\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n                <sc-raw-select value=\"{{ form.transmision }}\" sc-camel-on-change=\"{{ onField.transmision }}\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none;cursor:pointer\">\n                  <option value=\"Automática\">Automática<\u002Foption>\n                  <option value=\"Manual\">Manual<\u002Foption>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ form.combustible }}\" sc-camel-on-change=\"{{ onField.combustible }}\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none;cursor:pointer\">\n                  <option value=\"Nafta\">Nafta<\u002Foption>\n                  <option value=\"Diésel\">Diésel<\u002Foption>\n                  <option value=\"Híbrido\">Híbrido<\u002Foption>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ form.estado }}\" sc-camel-on-change=\"{{ onField.estado }}\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none;cursor:pointer\">\n                  <option value=\"Disponible\">Disponible<\u002Foption>\n                  <option value=\"Reservado\">Reservado<\u002Foption>\n                  <option value=\"Vendido\">Vendido<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <input value=\"{{ form.img }}\" sc-camel-on-change=\"{{ onField.img }}\" placeholder=\"URL de la foto (opcional — si no, queda el espacio para arrastrar la imagen)\" style=\"background:#101215;border:1px solid rgba(255,255,255,0.12);color:#f2f3f4;padding:11px 12px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(255,255,255,0.4)\">\n              <div style=\"display:flex;gap:10px\">\n                <button sc-camel-on-click=\"{{ saveCar }}\" style=\"flex:1;background:#1f8f5f;border:1px solid #24a56d;color:#ffffff;padding:13px;font-family:Archivo,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#24a56d\">{{ saveLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ editing }}\">\n                  <button sc-camel-on-click=\"{{ cancelEdit }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,0.16);color:#c9ced3;padding:13px 18px;font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,0.45);color:#ffffff\">Cancelar<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:#a8aeb4\">Unidades cargadas ({{ stats.total }})<\u002Fspan>\n              <sc-for list=\"{{ cars }}\" as=\"car\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(255,255,255,0.09);background:#101215;padding:14px 16px\">\n                  <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\">\n                    <span style=\"font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ car.titulo }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;color:#8b9198\">{{ car.resumen }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;flex-shrink:0\">\n                    <button sc-camel-on-click=\"{{ car.onEdit }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,0.14);color:#c9ced3;padding:8px 12px;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,0.45);color:#ffffff\">Editar<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ car.onDelete }}\" style=\"background:transparent;border:1px solid rgba(224,112,95,0.4);color:#e0705f;padding:8px 12px;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:#e0705f;color:#ffffff\">Borrar<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarIntro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;},&quot;rotarHero&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;}}\">\nconst PHONE = \"5491164489906\";\nconst KEY = \"tmmotors_stock_v2\";\nconst PIN = \"2468\";\n\nconst pic = k => ((window.TM_IMG || {})[k] || \"\");\n\nconst SEED = [\n  { id: \"c5\", marca: \"Audi\", modelo: \"S3\", version: \"2.0 TFSI Quattro S-Tronic — 0 km\", anio: 2025, km: 0, precio: 0, transmision: \"Automática\", combustible: \"Nafta\", estado: \"Disponible\", imgKey: \"s3\", img: \"\" },\n  { id: \"c1\", marca: \"Mercedes-Benz\", modelo: \"A45 S\", version: \"AMG 2.0T 4Matic+ 421 cv\", anio: 2023, km: 35000, precio: 113000, transmision: \"Automática\", combustible: \"Nafta\", estado: \"Disponible\", imgKey: \"mercedes\", img: \"\" },\n  { id: \"c2\", marca: \"Audi\", modelo: \"Q7\", version: \"3.0 V6 TFSI Quattro Tiptronic\", anio: 2013, km: 180000, precio: 22000, transmision: \"Automática\", combustible: \"Nafta\", estado: \"Disponible\", imgKey: \"q7\", img: \"\" },\n  { id: \"c3\", marca: \"Honda\", modelo: \"HR-V\", version: \"EX 1.8 CVT\", anio: 2020, km: 51000, precio: 22000, transmision: \"Automática\", combustible: \"Nafta\", estado: \"Disponible\", imgKey: \"hrv\", img: \"\" },\n  { id: \"c4\", marca: \"Volkswagen\", modelo: \"Golf\", version: \"Comfortline 1.4T DSG\", anio: 2017, km: 126000, precio: 18000, transmision: \"Automática\", combustible: \"Nafta\", estado: \"Disponible\", imgKey: \"golf\", img: \"\" }\n];\n\nconst EMPTY = { marca: \"\", modelo: \"\", version: \"\", anio: \"\", km: \"\", precio: \"\", transmision: \"Automática\", combustible: \"Nafta\", estado: \"Disponible\", img: \"\" };\n\nclass Component extends DCLogic {\n  state = {\n    cars: SEED,\n    query: \"\",\n    estado: \"todos\",\n    sort: \"recientes\",\n    adminOpen: false,\n    authed: false,\n    pin: \"\",\n    pinError: false,\n    editing: null,\n    form: Object.assign({}, EMPTY),\n    hero: 0,\n    intro: true\n  };\n\n  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.introTimer); clearInterval(this.imgTimer); }\n\n  componentDidMount() {\n    try {\n      const raw = window.localStorage.getItem(KEY);\n      if (raw) {\n        const parsed = JSON.parse(raw);\n        if (Array.isArray(parsed) && parsed.length) {\n          const merged = parsed.map(c => {\n            if (c.img) return c;\n            const seed = SEED.filter(s => s.id === c.id)[0];\n            return seed ? Object.assign({}, c, { img: seed.img }) : c;\n          });\n          this.setState({ cars: merged });\n        }\n      }\n    } catch (e) {}\n    if (this.props.rotarHero !== false) this.timer = setInterval(() => this.setState(st => ({ hero: st.hero + 1 })), 4500);\n    if (!window.TM_IMG) {\n      let tries = 0;\n      this.imgTimer = setInterval(() => {\n        tries++;\n        if (window.TM_IMG || tries > 60) { clearInterval(this.imgTimer); this.forceUpdate(); }\n      }, 100);\n    }\n    if (this.props.mostrarIntro === false) this.setState({ intro: false });\n    else this.introTimer = setTimeout(() => this.setState({ intro: false }), 3100);\n  }\n\n  persist(cars) {\n    try { window.localStorage.setItem(KEY, JSON.stringify(cars)); } catch (e) {}\n  }\n\n  setCars(cars) {\n    this.setState({ cars });\n    this.persist(cars);\n  }\n\n  fmtNum(n) {\n    const v = Number(n) || 0;\n    return v.toLocaleString(\"es-AR\");\n  }\n\n  wa(car) {\n    const msg = \"Hola TM Motors! Me interesa el \" + car.marca + \" \" + car.modelo + \" \" + car.anio + \" (U$S \" + this.fmtNum(car.precio) + \"). Sigue disponible?\";\n    return \"https://wa.me/\" + PHONE + \"?text=\" + encodeURIComponent(msg);\n  }\n\n  decorate(car) {\n    return Object.assign({}, car, {\n      img: car.img || pic(car.imgKey),\n      titulo: car.marca + \" \" + car.modelo,\n      slotId: \"tm-car-\" + car.id,\n      slotHint: \"Foto \" + car.marca + \" \" + car.modelo,\n      kmFmt: this.fmtNum(car.km),\n      precioFmt: Number(car.precio) > 0 ? \"U$S \" + this.fmtNum(car.precio) : \"Consultar\",\n      resumen: car.anio + \" · \" + this.fmtNum(car.km) + \" km · U$S \" + this.fmtNum(car.precio) + \" · \" + car.estado,\n      isDisponible: car.estado === \"Disponible\",\n      isReservado: car.estado === \"Reservado\",\n      isVendido: car.estado === \"Vendido\",\n      wa: this.wa(car),\n      onEdit: () => this.setState({ editing: car.id, form: Object.assign({}, EMPTY, car) }),\n      onDelete: () => this.setCars(this.state.cars.filter(c => c.id !== car.id))\n    });\n  }\n\n  saveCar = () => {\n    const f = this.state.form;\n    if (!f.marca.trim() || !f.modelo.trim()) return;\n    const clean = {\n      marca: f.marca.trim(),\n      modelo: f.modelo.trim(),\n      version: f.version.trim(),\n      anio: f.anio,\n      km: Number(String(f.km).replace(/\\D/g, \"\")) || 0,\n      precio: Number(String(f.precio).replace(/\\D/g, \"\")) || 0,\n      transmision: f.transmision,\n      combustible: f.combustible,\n      estado: f.estado,\n      img: f.img.trim()\n    };\n    if (this.state.editing) {\n      this.setCars(this.state.cars.map(c => c.id === this.state.editing ? Object.assign({}, c, clean) : c));\n    } else {\n      const car = Object.assign({ id: \"c\" + Date.now() }, clean);\n      this.setCars([car].concat(this.state.cars));\n    }\n    this.setState({ editing: null, form: Object.assign({}, EMPTY) });\n  };\n\n  renderVals() {\n    const s = this.state;\n    const field = {};\n    [\"marca\", \"modelo\", \"version\", \"anio\", \"km\", \"precio\", \"transmision\", \"combustible\", \"estado\", \"img\"].forEach(k => {\n      field[k] = e => {\n        const v = e.target.value;\n        this.setState(st => ({ form: Object.assign({}, st.form, { [k]: v }) }));\n      };\n    });\n\n    const q = s.query.trim().toLowerCase();\n    let list = s.cars.filter(c => {\n      const hit = (c.marca + \" \" + c.modelo + \" \" + c.version).toLowerCase().indexOf(q) !== -1;\n      const est = s.estado === \"todos\" || c.estado === s.estado;\n      return hit && est;\n    });\n    if (s.sort === \"precio-asc\") list = list.slice().sort((a, b) => a.precio - b.precio);\n    if (s.sort === \"precio-desc\") list = list.slice().sort((a, b) => b.precio - a.precio);\n    if (s.sort === \"km-asc\") list = list.slice().sort((a, b) => a.km - b.km);\n\n    const enVidriera = s.cars.filter(c => c.estado !== \"Vendido\").map(c => this.decorate(c)).filter(c => !!c.img);\n    const heroCar = enVidriera.length ? enVidriera[s.hero % enVidriera.length] : null;\n\n    return {\n      logo: pic(\"logo\"),\n      hayLogo: !!pic(\"logo\"),\n      intro: s.intro && this.props.mostrarIntro !== false,\n      skipIntro: () => { clearTimeout(this.introTimer); this.setState({ intro: false }); },\n      heroImg: heroCar ? heroCar.img : \"\",\n      heroTitulo: heroCar ? heroCar.titulo : \"\",\n      heroDetalle: heroCar ? heroCar.anio + \" · \" + heroCar.kmFmt + \" km · \" + heroCar.precioFmt : \"\",\n      heroWa: heroCar ? heroCar.wa : \"\",\n      hayHero: !!heroCar,\n      waGeneral: \"https://wa.me/\" + PHONE + \"?text=\" + encodeURIComponent(\"Hola TM Motors! Quiero consultar por el stock disponible.\"),\n      cars: s.cars.map(c => this.decorate(c)),\n      visibles: list.map(c => this.decorate(c)),\n      vacio: list.length === 0,\n      stats: { total: s.cars.length },\n      query: s.query,\n      estado: s.estado,\n      sort: s.sort,\n      onQuery: e => this.setState({ query: e.target.value }),\n      onEstado: e => this.setState({ estado: e.target.value }),\n      onSort: e => this.setState({ sort: e.target.value }),\n      adminOpen: s.adminOpen,\n      authed: s.adminOpen && s.authed,\n      needsPin: s.adminOpen && !s.authed,\n      pin: s.pin,\n      pinError: s.pinError,\n      openAdmin: () => this.setState({ adminOpen: true }),\n      closeAdmin: () => this.setState({ adminOpen: false, pin: \"\", pinError: false }),\n      onPin: e => this.setState({ pin: e.target.value, pinError: false }),\n      tryPin: () => this.setState(st => st.pin.trim() === PIN ? { authed: true, pin: \"\", pinError: false } : { pinError: true }),\n      form: s.form,\n      onField: field,\n      editing: !!s.editing,\n      formTitle: s.editing ? \"Editar unidad\" : \"Cargar nueva unidad\",\n      saveLabel: s.editing ? \"Guardar cambios\" : \"Agregar al stock\",\n      saveCar: this.saveCar,\n      cancelEdit: () => this.setState({ editing: null, form: Object.assign({}, EMPTY) })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
